StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/jamiebullock/vale-style/releases/download/v0.1.0/vale-style.zip
Vocab = LibXtract

[*.md]
Plain.Flourish = warning
Plain.Spelling = warning

[*.{c,h,i}]
LibXtract.Project = YES
Plain.Phase = NO
Plain.Ascii = warning
Plain.Repetition = warning
Plain.Spelling = warning
Comments.IssueRef = warning
Comments.LineComment = warning

[*.cpp]
LibXtract.Project = YES
Plain.Spelling = warning

[{*CMakeLists.txt,*.cmake,*Makefile,*.mk,*.py}]
LibXtract.Project = YES

[*include/xtract/xtract_{scalar,vector,delta}.h]
LibXtract.Return = YES

[*src/{ooura,c-ringbuf,dywapitchtrack}/*]
BasedOnStyles =

[{*tests/utest.h,*bench/ubench.h,*examples/simpletest/dr_wav.h}]
BasedOnStyles =
