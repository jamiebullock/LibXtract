name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test
        run: |
          cmake --preset default
          cmake --build --preset default
          ctest --preset default

      - name: Static analysis
        run: cmake --build --preset default --target analyze

      - name: Sanitizer tests
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan

      - name: cppcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cppcheck
          cmake --build --preset default --target cppcheck

  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y swig

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig

      # The Windows image ships SWIG. The Node.js headers are not part of the
      # setup-node install, and a Windows module links against node.lib from
      # the same release.
      - name: Install Node.js headers and node-addon-api
        shell: bash
        run: |
          NODE_VER=$(node -v | tr -d v)
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o node-headers.tar.gz "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-headers.tar.gz"
          tar xzf node-headers.tar.gz
          ROOT=$(pwd -W 2>/dev/null || pwd)
          NODE_ARGS="-DXTRACT_NODE_INCLUDE_DIR=${ROOT}/node-v${NODE_VER}/include/node"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o node.lib "https://nodejs.org/dist/v${NODE_VER}/win-x64/node.lib"
            NODE_ARGS="$NODE_ARGS -DXTRACT_NODE_LIBRARY=${ROOT}/node.lib"
          fi
          echo "XTRACT_NODE_ARGS=$NODE_ARGS" >> "$GITHUB_ENV"
          npm install --prefix swig node-addon-api

      - name: Configure
        run: cmake --preset default -DXTRACT_BUILD_PYTHON=ON -DXTRACT_BUILD_JAVA=ON -DXTRACT_BUILD_NODE=ON ${{ env.XTRACT_NODE_ARGS }}

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

      - name: Install
        run: cmake --install build/default --prefix build/dist --config Release

      - name: Build a consumer against the installed package
        run: |
          cmake -S tests/package -B build/package -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/dist"
          cmake --build build/package --config Release
          ctest --test-dir build/package --build-config Release --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install clang (provides libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Fuzz feature functions (libFuzzer, ASan + UBSan)
        run: |
          cmake --preset fuzz -DXTRACT_FUZZ_TIME=60
          cmake --build --preset fuzz
          ctest --preset fuzz

      - name: Upload crash reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: build/fuzz/fuzz/crash-*
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install clang-18 and Mull
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o mull.deb https://github.com/mull-project/mull/releases/download/0.34.1/Mull-18-0.34.1-LLVM-18.1.3-ubuntu-amd64-24.04.deb
          echo "983ea9c84ecab621414d5442a66c1a1ce4127491b79d42fd5e2fd6fe01d02699  mull.deb" | sha256sum -c -
          sudo apt-get update && sudo apt-get install -y clang-18 ./mull.deb

      - name: Mutation tests (Mull, ASan + UBSan)
        run: |
          cmake --preset mutation
          cmake --build --preset mutation
          cmake --build --preset mutation --target mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/mutation/reports/mutation.json
          if-no-files-found: error
          retention-days: 7

  # The proofs take about fifteen minutes, so they run on every push to main
  # and develop and not on pull requests. A failure opens an issue, or adds
  # a comment to the open issue for that branch, so that it is not missed.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install CBMC 6.11.0 and Bitwuzla 0.9.1
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o cbmc.deb https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb
          echo "b3721aa541038384d7801ea3aeabbcddc3e8845ac8f1cbff637cf8dec7481ac8  cbmc.deb" | sha256sum -c -
          sudo dpkg -i cbmc.deb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o bitwuzla.zip https://github.com/bitwuzla/bitwuzla/releases/download/0.9.1/Bitwuzla-Linux-x86_64-static.zip
          echo "057f1546ae2068df57beb178f3eeab1678f0e5f0c378787a05b7bb294617c9c6  bitwuzla.zip" | sha256sum -c -
          unzip -q bitwuzla.zip
          sudo install Bitwuzla-Linux-x86_64-static/bin/bitwuzla /usr/local/bin/bitwuzla
          bitwuzla --version

      - name: Bounded model checking (CBMC)
        run: make -C verify

      - name: Upload proof logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify/.proofs/*.log
          include-hidden-files: true
          if-no-files-found: ignore

      # A proof that hits the job timeout ends the job as cancelled
      - name: Open or update an issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CBMC proofs failed on $GITHUB_REF_NAME"
          body="The verify job failed on $GITHUB_REF_NAME at $GITHUB_SHA: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned to match the version the tree was formatted with; clang-format
      # output drifts between releases, so the check and a local build of the
      # format target must use the same version.
      - name: Install clang-format 20.1.8
        run: pipx install clang-format==20.1.8

      - name: Check formatting
        run: cmake -P cmake/format.cmake
