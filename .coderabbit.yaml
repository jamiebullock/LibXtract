language: en-GB

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  request_changes_workflow: true
  review_status: false
  path_filters:
    - '!src/ooura/**'
    - '!src/c-ringbuf/**'
    - '!src/dywapitchtrack/**'
  path_instructions:
    - path: 'src/**/*.c'
      instructions: |
        Formatting (Allman braces, indentation, pointer placement) is
        enforced by clang-format in CI. Do not comment on it.

        C99 with every declaration at the top of its block, before any
        statement; the build enforces this with -Wdeclaration-after-statement.
        Initialise a variable at its declaration only when the value is known
        and meaningful; otherwise leave it uninitialised and assign it on
        every path before use. Flag a defensive zero of a variable that is
        unconditionally assigned later: the dead store hides a missing
        assignment from the compiler.

        Vale checks comments in CI (the prose job): block comments only,
        ASCII, spelling, and no reference to an issue or a pull request. Do
        not comment on those. A comment must be self-contained and say
        something the code does not; flag one that restates the code or
        refers to change history.

        Feature functions share the signature
        int xtract_foo(const double *data, const int N, const void *argv, double *result)
        and return an XTRACT_ status code. Check mathematical correctness
        and edge cases: division by zero, off-by-one, buffer bounds, N <= 0,
        the layout of argv. Look for copy-paste errors between sibling
        functions and for unused code.

        Numeric range: variances, covariances and sums of squares or
        products are accumulated in double arithmetic without rescaling,
        as xtract_variance() does, and the functions must agree with each
        other. Do not report a finding that depends on any of these:
        such an accumulated quantity overflowing, underflowing to zero or
        being subnormal, whether the function computes it or receives it
        as input; input values that differ only in their last unit of
        precision, so that their mean is not a double; a result that is
        itself beyond the range of a double. Do report an intermediate
        expression that overflows or underflows when the accumulated
        quantities and the result are all representable, and any input
        of ordinary magnitude that gives NaN, infinity or the wrong
        status code.
    - path: 'include/**/*.h'
      instructions: |
        Public API. Every declaration carries a Doxygen block (\brief and
        \param) stating the contract; for a feature function that includes
        the argv layout and the expected size and format of data. Do not ask
        for a \return entry:
        every feature function returns an XTRACT_ status code through the
        same interface, and repeating that per declaration is not wanted.
        Flag a change that alters a contract without updating its Doxygen.
    - path: 'tests/**'
      instructions: |
        Tests exercise the production code path against values derived from
        the documented formulae. Flag a test that only pins the current
        output, or a test-only hook added to production code to make a test
        pass.
        Do not ask for a regression test of an input that the numeric
        range paragraph of the src instructions excludes.
    - path: '**/*.md'
      instructions: |
        Vale checks spelling, ASCII and banned wording in CI (the prose
        job). Do not comment on those.
    - path: 'CHANGELOG.md'
      instructions: |
        The rules are in the Changelog section of CONTRIBUTING.md, and the
        prose-check target enforces the format, so do not comment on the
        format. The one exception is the link that ends an entry: the check
        accepts a link to an issue or a commit, and the rules ask for the
        pull request, so flag any other link.

        Check each entry against the code and the pull request it cites.
        When an entry is inaccurate, ask for it to be corrected or narrowed
        within one line. Do not ask for exceptions, qualifications or
        explanations to be added to an entry.

        Flag an entry that gives a reason, a mechanism or history, one that
        restates arguments the header documents, and one that records a
        change no user of the library can observe (CI, tests, tooling,
        refactoring).
  pre_merge_checks:
    docstrings:
      mode: off
  auto_review:
    enabled: true
    drafts: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CONTRIBUTING.md'

chat:
  auto_reply: true
